<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <meta property="og:title" content="Will you be my Valentine? 🌹">
    <meta property="og:description" content="I have a special question for you... Click to answer! ❤️">
    <meta property="og:image" content="https://ui-avatars.com/api/?name=Valentine&background=ff4d6d&color=fff&size=512">
    <meta property="og:url" content="https://valentine-invite.vercel.app">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ff4d6d">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="card" id="card">
            <h1 class="title">Will you be my Valentine, Nicolle?🌹</h1>
            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Yes baby!</button>
                <button id="noBtn" class="btn no-btn">No!</button>
            </div>
            <div id="successMessage" class="hidden">
                <h2>Yay! ❤️</h2>
                <p>I knew you'd say yes!</p>
                <p>Can't wait for our date! 🥰</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
